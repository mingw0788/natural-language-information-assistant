{% extends "base.html" %}
{% block title %}任务详情 · 自然语言信息采集助手{% endblock %}
{% block content %}
  <section class="hero compact-hero">
    <p class="eyebrow">任务 #{{ task.id[:8] }} · 版本 {{ task.latest_version.number }}</p>
    <h1>任务详情</h1>
    <p class="intro">{{ task.latest_version.spec.raw_input }}</p>
    <a class="secondary-link" href="/">创建新任务</a>
  </section>
  <section id="task-page" class="panel" data-task-id="{{ task.id }}">
    <div id="task-detail-capability" class="notice" role="status"></div>
    <div class="section-heading">
      <h2>运行与结果</h2>
      <div class="inline-actions">
        <button class="primary-button" id="task-page-start" type="button">开始新一轮</button>
        <button class="secondary-button" id="task-page-keep-results" type="button">清理原文，保留结果</button>
        <button class="danger-button" id="task-page-delete" type="button">删除任务及结果</button>
      </div>
    </div>
    <div class="section-heading">
      <p id="task-page-run" role="status">还没有运行记录。</p>
      <div class="inline-actions">
        <button class="secondary-button hidden" id="task-page-pause" type="button">暂停</button>
        <button class="secondary-button hidden" id="task-page-resume" type="button">恢复</button>
        <button class="danger-button hidden" id="task-page-cancel" type="button">停止本轮</button>
      </div>
    </div>
    <div class="progress-layout">
      <div><h3>运行进展</h3><ol id="task-page-events" class="event-list"></ol></div>
      <div><h3>本轮额度</h3><dl id="task-page-budget" class="budget-list"></dl></div>
    </div>
    <div class="export-tools">
      <label for="result-sort">结果排序</label>
      <select id="result-sort" aria-label="结果排序"><option value="name_asc">名称升序</option><option value="name_desc">名称降序</option><option value="status">先按核查状态</option></select>
      <label for="task-export-format">导出格式</label>
      <select id="task-export-format"><option value="csv">CSV</option><option value="xlsx">Excel</option><option value="json">JSON</option><option value="markdown">Markdown</option><option value="text">文本</option></select>
      <button class="secondary-button" id="task-export-button" type="button">导出结果</button>
      <button class="secondary-button" id="compare-button" type="button">比较选中对象</button>
      <button class="quiet-button" id="task-copy-button" type="button">复制文本</button>
    </div>
    <p id="selected-count" class="helper-text" aria-live="polite">已选 0 个对象</p>
    <div id="compare-results" class="comparison-results hidden" aria-live="polite"></div>
    <div id="task-page-results" class="result-list"></div>
    <p id="task-page-error" class="error-text" role="alert"></p>
  </section>
{% endblock %}
